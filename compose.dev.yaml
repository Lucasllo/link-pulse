# Dependências para rodar a API localmente (make db-up / make run): Postgres 18 e Valkey 8.1.
# Sem make: docker compose -f compose.dev.yaml up -d --wait
# Credenciais fixas só para desenvolvimento local; prod recebe SPRING_DATASOURCE_* e
# SPRING_DATA_REDIS_HOST/SPRING_DATA_REDIS_PORT por env.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: linkpulse
      POSTGRES_USER: linkpulse
      POSTGRES_PASSWORD: linkpulse
    # Só no loopback: o banco de dev não fica exposto na rede.
    ports:
      - "127.0.0.1:5432:5432"
    # Postgres 18 mudou o PGDATA para /var/lib/postgresql/18/docker; monta-se o diretório pai.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkpulse -d linkpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cache do redirect (Redis-compatível). volatile-lru só despeja chaves com TTL, como no ElastiCache.
  valkey:
    image: valkey/valkey:8.1
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    # Só no loopback, como o Postgres.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}
