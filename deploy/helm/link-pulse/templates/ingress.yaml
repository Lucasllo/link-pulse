{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "link-pulse.fullname" . }}
  labels:
    {{- include "link-pulse.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Sem subpath: o GET /{code} fica na raiz do host (D-02).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "link-pulse.fullname" . }}
                # Só a porta da API; a management (actuator) nunca sai pelo Ingress.
                port:
                  name: http
{{- end }}
