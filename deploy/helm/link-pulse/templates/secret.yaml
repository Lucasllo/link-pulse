{{- if .Values.secret.create }}
{{- $data := .Values.secret.data | default dict }}
{{- $key := required "secret.data.LINKPULSE_IP_HASH_KEY é obrigatório quando secret.create=true" $data.LINKPULSE_IP_HASH_KEY | toString }}
{{- if lt (len $key) 16 }}
{{- fail "LINKPULSE_IP_HASH_KEY precisa de pelo menos 16 caracteres" }}
{{- end }}
{{- $_ := required "secret.data.SPRING_DATASOURCE_PASSWORD é obrigatório quando secret.create=true" $data.SPRING_DATASOURCE_PASSWORD }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "link-pulse.fullname" . }}
  labels:
    {{- include "link-pulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
