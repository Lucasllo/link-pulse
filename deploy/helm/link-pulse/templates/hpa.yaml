{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "link-pulse.fullname" . }}
  labels:
    {{- include "link-pulse.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "link-pulse.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    # Utilização relativa a resources.requests.cpu do container (precisa do metrics-server).
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    # Sobe rápido num pico (janela 0, o default do scale-up: reage na hora, sem esperar pela menor
    # recomendação de uma janela); desce devagar para não oscilar (e não derrubar o pool do Hikari à
    # toa).
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
