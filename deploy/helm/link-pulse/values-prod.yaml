# Perfil de produção de referência: só renderizado e validado pelo make k8s-lint, nunca instalado
# no kind; troque nomes e domínio pelos do seu ambiente.
# Nenhum segredo aqui: senha do Postgres, chave do HMAC, senha do Valkey e connection string do
# Mongo vêm de um Secret criado fora do chart.

image:
  repository: ghcr.io/lucasllo/link-pulse
  # A tag vem do deploy: --set image.tag=sha-{sha7} (a imagem que o CI publica no GHCR).
  pullPolicy: IfNotPresent

# 2 a 6 réplicas: 6 x 10 conexões do Hikari = 60, abaixo do max_connections (100) do Postgres.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    memory: 1536Mi

env:
  # Profile prod: sem seed do Liquibase (D-08).
  SPRING_PROFILES_ACTIVE: prod
  # link-pulse-db, link-pulse-cache e link-pulse-clicks: Services (ou ExternalName) apontando para
  # os serviços gerenciados (RDS, ElastiCache e o Mongo do ambiente).
  # sslmode=require: TLS obrigatório até o RDS, mas sem validar o certificado. verify-full exige o
  # bundle de CA do RDS dentro do container (sslrootcert), que a imagem não traz.
  SPRING_DATASOURCE_URL: jdbc:postgresql://link-pulse-db:5432/linkpulse?sslmode=require
  SPRING_DATASOURCE_USERNAME: linkpulse
  # Senha (AUTH token) do Valkey no Secret. Lacuna conhecida: o TLS do Valkey ainda não está
  # ligado, porque a conexão própria do consumer de cliques
  # (ClickStreamConsumer.dedicatedConnectionFactory) não lê o spring.data.redis.ssl. Com
  # SPRING_DATA_REDIS_SSL_ENABLED=true, só o cache e o rate limit falariam TLS, e o consumer não
  # conectaria a um ElastiCache com transit encryption. Fica para o deploy na AWS (Phase 5).
  SPRING_DATA_REDIS_HOST: link-pulse-cache
  SPRING_DATA_REDIS_PORT: "6379"
  # SPRING_MONGODB_URI fica no Secret, e não aqui: a connection string leva usuário, senha e
  # tls=true.
  LINKPULSE_BASE_URL: https://lp.example.com
  # Impede link apontando para o próprio app pelos nomes internos do Service e pelo domínio público.
  LINKPULSE_SELF_HOSTS: link-pulse,link-pulse.link-pulse,link-pulse.link-pulse.svc,link-pulse.link-pulse.svc.cluster.local,lp.example.com
  # Só de proxies neste CIDR o app aceita o X-Forwarded-For (IP real do rate limit). Um /16 cobre a
  # rede de pods inteira, não só o ingress controller: quem fecha o bypass é a networkPolicy abaixo,
  # que só deixa o controller chegar à porta http. Sem ela, restrinja ao CIDR das subnets dos pods
  # do controller.
  SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES: 10.0.0.0/16
  # Logs estruturados (JSON ECS) para o agregador de logs do cluster.
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

secret:
  # O chart não cria Secret em produção. link-pulse-secrets é criado fora do chart, por External
  # Secrets ou pelo time de plataforma, com as chaves:
  #   SPRING_DATASOURCE_PASSWORD
  #   LINKPULSE_IP_HASH_KEY       (pelo menos 16 caracteres)
  #   SPRING_DATA_REDIS_PASSWORD  (AUTH token do ElastiCache)
  #   SPRING_MONGODB_URI          (mongodb+srv://usuario:senha@.../linkpulse?tls=true)
  # O secretRef vem depois do configMapRef no envFrom: uma chave repetida vale a do Secret. Sem
  # SPRING_MONGODB_URI, o app cai no default localhost:27017 e só o /stats e o consumer falham.
  create: false
  existingSecret: link-pulse-secrets

ingress:
  host: lp.example.com
  # Certificado em um Secret TLS (cert-manager ou importado).
  tls:
    - secretName: link-pulse-tls
      hosts:
        - lp.example.com

# Uma réplica por zona sempre que der; sem bloquear o agendamento se uma zona faltar.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

# Porta http só para o ingress controller e Actuator só para o Prometheus. Namespaces e labels são
# os do kind (Traefik em traefik, kube-prometheus-stack em monitoring); troque pelos do seu cluster.
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus

# Um pod por vez num drain ou upgrade de nós: as 2 réplicas mínimas nunca saem juntas.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
