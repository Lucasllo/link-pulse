# Senha do Postgres do kind. O default vem do values.yaml (demonstração, não é segredo).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: link-pulse
type: Opaque
stringData:
  password: {{ required "postgres.password é obrigatório" .Values.postgres.password | quote }}
