name: ci

on:
  push:
    branches: [main]
  pull_request:

# O token do workflow só lê o repositório. Só o job publish (push na main) ganha escrita no GHCR
# e nas attestations, com o GITHUB_TOKEN; nenhum secret próprio é usado.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancela só PR: um push na main nunca morre no meio do publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # Checkout num caminho com espaço: prova a cada push que o build aguenta "projeto 4" no Windows.
        working-directory: "link pulse/app"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "link pulse"

      - name: Java 21 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "link pulse/app/pom.xml"

      - name: mvnw é executável e LF
        run: test -x mvnw && ! grep -q $'\r' mvnw

      - name: Makefile parseia no Linux
        working-directory: "link pulse"
        run: make -n verify && make -n k8s && make help

      - name: Build, Checkstyle, testes unitários + Testcontainers, SpotBugs
        run: ./mvnw -B -ntp verify

      - name: Relatórios em caso de falha
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            link pulse/app/target/surefire-reports
            link pulse/app/target/failsafe-reports
            link pulse/app/target/spotbugsXml.xml
            link pulse/app/target/checkstyle-result.xml
          if-no-files-found: ignore

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "link pulse"

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build da imagem (link-pulse:local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "link pulse/app"
          load: true
          push: false
          tags: link-pulse:local
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # As attestations (provenance e SBOM) vêm do actions/attest no publish.
          provenance: false
          sbom: false
          # O cache gha guarda as camadas, não o --mount=type=cache do ~/.m2.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy (falha em CRITICAL com correção disponível)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          image-ref: link-pulse:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          # O default de 5 min conta o download do trivy-java-db (~940 MB) no primeiro run.
          timeout: 10m

      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: link-pulse:local
          format: cyclonedx
          output: sbom.cdx.json
          # A trivy-action pode repassar os inputs do passo anterior por variáveis TRIVY_*;
          # sem isto o SBOM herdaria o filtro e o exit code do scan.
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          timeout: 10m

      - name: SBOM não vazio
        # Os pacotes do Ubuntu noble do Temurin mais os jars do Spring Boot passam folgado de
        # 50 componentes: um SBOM vazio ou trivial falha o job.
        run: jq -e '(.components | length) >= 50' sbom.cdx.json

      - name: Exporta a imagem testada
        run: docker image save -o link-pulse.tar link-pulse:local

      - name: Artifact da imagem
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: link-pulse.tar
          retention-days: 1
          if-no-files-found: error

      - name: Artifact do SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  k8s-smoke:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: "link pulse"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "link pulse"

      - name: kind v0.33.0 (só o binário)
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          # O cluster é criado pelo up.sh; sem ignore_failed_clean o post step falha o job (Pitfall 18).
          install_only: true
          version: v0.33.0
          cluster_name: link-pulse
          ignore_failed_clean: true

      - name: Helm v4.3.1
        # O runner traz Helm 3; o up.sh exige o v4.
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Scripts executáveis e LF
        run: |
          for f in deploy/kind/*.sh; do
            test -x "$f" || { echo "sem bit executável: $f"; exit 1; }
            ! grep -q $'\r' "$f" || { echo "CRLF em: $f"; exit 1; }
          done

      - name: Regras do Prometheus (promtool)
        run: make obs-check

      - name: Lint dos charts
        # Falha rápido, antes de subir o cluster.
        run: bash deploy/kind/lint.sh

      - name: Baixa a imagem do commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: "link pulse"

      - name: Carrega a imagem no Docker
        run: docker load -i link-pulse.tar

      - name: make k8s (mesmo script do avaliador)
        run: bash deploy/kind/up.sh

      - name: "Smoke: link → 302 → stats"
        run: bash deploy/kind/smoke.sh

      - name: Diagnóstico do cluster
        if: failure()
        run: |
          kubectl --context kind-link-pulse get pods -A -o wide || true
          kubectl --context kind-link-pulse -n link-pulse describe pods || true
          kubectl --context kind-link-pulse -n link-pulse logs -l app.kubernetes.io/name=link-pulse --tail=300 || true
          kubectl --context kind-link-pulse get events -A --sort-by=.lastTimestamp || true
          helm --kube-context kind-link-pulse list -A || true

  publish:
    # PR, inclusive de fork e do Dependabot, nunca publica.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Só a imagem que passou no Trivy e no smoke em kind.
    needs: [build-test, image, k8s-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # As três abaixo são exigidas pelo actions/attest.
      id-token: write
      attestations: write
      artifact-metadata: write
    # Sem checkout e sem build: o digest publicado é o do tar testado.
    steps:
      - name: Baixa a imagem testada
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Baixa o SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom

      - name: Carrega a imagem no Docker
        run: docker load -i link-pulse.tar

      - name: Login no GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags (sha-{sha7} e latest)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # A action minusculiza Lucasllo -> lucasllo (Pitfall 14).
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push no GHCR
        id: push
        env:
          # Tags por env, nunca interpoladas direto no script.
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          first="" digest=""
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            docker tag link-pulse:local "$t"
            out=$(docker push "$t" | tee /dev/stderr)
            d=$(printf '%s\n' "$out" | grep -oE 'sha256:[0-9a-f]{64}' | tail -n1 || true)
            if [ -z "$first" ]; then
              first=$t digest=$d
            elif [ -n "$d" ] && [ -n "$digest" ] && [ "$d" != "$digest" ]; then
              echo "digest diferente entre tags: $digest x $d" >&2
              exit 1
            fi
          done <<< "$TAGS"
          name=${first%:*}
          if [ -z "$digest" ]; then
            # Alternativa: o RepoDigests que o push grava na imagem local.
            ref=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$first" | grep -F "$name@" | head -n1 || true)
            digest=${ref#*@}
          fi
          if ! printf '%s' "$digest" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "digest inválido: '$digest'" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attestation de provenance (SLSA)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attestation do SBOM (CycloneDX)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
